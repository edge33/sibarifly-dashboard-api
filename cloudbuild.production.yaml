# Production trigger: stable vMAJOR.MINOR.PATCH tags only. No Docker build step.
timeout: 1800s
options:
  logging: CLOUD_LOGGING_ONLY
substitutions:
  _REGION: europe-west8
  _SERVICE: sibarifly-dashboard-main
  _DEV_BUILD_REGION: europe-west8
steps:
  - id: verify-release
    name: node:24-slim
    entrypoint: node
    env: [RELEASE_TAG=$TAG_NAME]
    args: [scripts/verify-release.mjs]

  - id: find-tested-image
    name: gcr.io/google.com/cloudsdktool/google-cloud-cli:slim
    entrypoint: bash
    env:
      - IMAGE=gcr.io/$PROJECT_ID/github.com/edge33/sibarifly-dashboard
      - RELEASE_COMMIT=$COMMIT_SHA
      - DEV_TRIGGER_ID=$_DEV_TRIGGER_ID
      - DEV_BUILD_REGION=$_DEV_BUILD_REGION
    args: [scripts/wait-for-development.sh]

  - id: migrate
    name: node:24-slim
    entrypoint: sh
    secretEnv: [DATABASE_URL, DIRECT_URL]
    args:
      - -ec
      - |
        npm install -g pnpm@12.7.0
        pnpm install --frozen-lockfile
        pnpm prisma migrate deploy

  - id: deploy
    name: gcr.io/google.com/cloudsdktool/google-cloud-cli:slim
    entrypoint: bash
    env: [SERVICE=$_SERVICE, REGION=$_REGION]
    args:
      - -ec
      - |
        image=$(cat /workspace/release-image.txt)
        gcloud run deploy "$$SERVICE" --image="$$image" --region="$$REGION" \
          --allow-unauthenticated --quiet
availableSecrets:
  secretManager:
    - versionName: projects/$PROJECT_ID/secrets/${_DATABASE_URL_SECRET}/versions/latest
      env: DATABASE_URL
    - versionName: projects/$PROJECT_ID/secrets/${_DIRECT_URL_SECRET}/versions/latest
      env: DIRECT_URL
