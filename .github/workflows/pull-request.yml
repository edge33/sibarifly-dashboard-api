name: Pull request checks

on:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/setup@v3
        with:
          cache: true
          require-lockfile: true

      - name: Typecheck
        run: pnpm typecheck

      - name: Biome check
        run: pnpm lint

      - name: Test with coverage
        run: pnpm test:coverage
