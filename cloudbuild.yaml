# Development trigger: every push to main, with no file filters.
options:
  logging: CLOUD_LOGGING_ONLY
substitutions:
  _REGION: europe-west8
  _SERVICE: sibarifly-dashboard-develop
steps:
  - id: checks
    name: node:24.22.1-slim@sha256:55fb5f5a527ea2c5c4a95f963e48ef90aa38c7b346054fdc8ee9957a2b55d205
    entrypoint: sh
    args:
      - -ec
      - |
        npm install -g pnpm@12.7.0
        pnpm install --frozen-lockfile
        pnpm prisma-generate
        pnpm lint
        pnpm typecheck
        pnpm test

  - id: build
    name: gcr.io/cloud-builders/docker@sha256:0aca0f95e1ba8f9107263d3e9782d5ce99a5b60d35b3f8985e4534b65552636f
    args:
      - build
      - --no-cache
      - --build-arg
      - WEB_APP_BRANCH=develop
      - --build-arg
      - VITE_API_URL=/api
      - --label
      - org.opencontainers.image.revision=$COMMIT_SHA
      - -t
      - gcr.io/$PROJECT_ID/github.com/edge33/sibarifly-dashboard:$COMMIT_SHA-$BUILD_ID
      - .

  - id: push
    name: gcr.io/cloud-builders/docker@sha256:0aca0f95e1ba8f9107263d3e9782d5ce99a5b60d35b3f8985e4534b65552636f
    args: [push, "gcr.io/$PROJECT_ID/github.com/edge33/sibarifly-dashboard:$COMMIT_SHA-$BUILD_ID"]

  - id: migrate
    name: node:24.22.1-slim@sha256:55fb5f5a527ea2c5c4a95f963e48ef90aa38c7b346054fdc8ee9957a2b55d205
    entrypoint: sh
    secretEnv: [DATABASE_URL, DIRECT_URL]
    args: [-ec, "./node_modules/.bin/prisma migrate deploy"]

  - id: deploy
    name: gcr.io/google.com/cloudsdktool/google-cloud-cli:slim@sha256:2a5368c4f3e25f7e202ccbd7b63e4128380d8fd683266f7f015c5d0afcc8f3be
    entrypoint: bash
    env:
      - IMAGE=gcr.io/$PROJECT_ID/github.com/edge33/sibarifly-dashboard:$COMMIT_SHA-$BUILD_ID
      - SERVICE=$_SERVICE
      - REGION=$_REGION
    args:
      - -ec
      - |
        digest=$(gcloud container images describe "$$IMAGE" --format='value(image_summary.digest)')
        [[ "$$digest" =~ ^sha256:[a-f0-9]{64}$$ ]]
        gcloud run deploy "$$SERVICE" --image="$${IMAGE%:*}@$$digest" \
          --region="$$REGION" --allow-unauthenticated --quiet

images:
  - gcr.io/$PROJECT_ID/github.com/edge33/sibarifly-dashboard:$COMMIT_SHA-$BUILD_ID
availableSecrets:
  secretManager:
    - versionName: projects/$PROJECT_ID/secrets/${_DATABASE_URL_SECRET}/versions/latest
      env: DATABASE_URL
    - versionName: projects/$PROJECT_ID/secrets/${_DIRECT_URL_SECRET}/versions/latest
      env: DIRECT_URL
